# ═══════════════════════════════════════════════════════════
# HOW TO ADD A NEW PUBLICATION
# ═══════════════════════════════════════════════════════════
#
# 1. Find the right section below:
#      journal_articles      → 期刊論文
#      conference_proceedings → 會議論文
#      books_translations    → 著作與譯作
#
# 2. Add a new entry starting with a dash and two spaces (- ).
#    Keep the same indentation as the existing entries.
#
# 3. Write the full citation in citation: "..."
#    Use **double asterisks** to bold the author name.
#    Use *single asterisks* for italics (journal/conference name).
#
# 4. doi: paste just the DOI number (e.g. "10.12345/xyz").
#    Leave doi: "" if there is no DOI.
#
# 5. status: "under_review" shows an "Under Review" badge.
#    Remove that line (or leave blank) for published work.
#
# EXAMPLE — copy this block and fill it in:
#
#   - citation: "**Han, J.** (2025). My New Paper. *Journal Name*, 1(1): 1-20."
#     doi: "10.12345/example"
#     status: under_review
#
# ═══════════════════════════════════════════════════════════

