<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | HAN Jingyi 韓婧怡</title>
    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
    <link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=DM+Mono:wght@300;400&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

<nav>
    <div class="nav-name"><a href="{{ '/' | relative_url }}" style="color: inherit; text-decoration: none;">HAN Jingyi · 韓婧怡</a></div>
    <ul class="nav-links">
        <li><a href="{{ '/' | relative_url }}" {% if page.url == '/' or page.url == '/index.html' %}style="color: var(--accent)"{% endif %}>Bio</a></li>
        <li><a href="{{ '/publications.html' | relative_url }}" {% if page.url == '/publications.html' %}style="color: var(--accent)"{% endif %}>Publications</a></li>
        <li><a href="{{ '/other.html' | relative_url }}" {% if page.url == '/other.html' %}style="color: var(--accent)"{% endif %}>Experience</a></li>
        <li><a href="{{ '/contact.html' | relative_url }}" {% if page.url == '/contact.html' %}style="color: var(--accent)"{% endif %}>Contact</a></li>
    </ul>
</nav>

<div class="page-content">
{{ content }}
</div>

<footer>
    <p>&copy; {{ site.time | date: "%Y" }} HAN Jingyi. All rights reserved. &nbsp;·&nbsp; Last updated {{ site.time | date: "%B %Y" }}</p>
</footer>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const observerOptions = {
        root: null,
        rootMargin: '0px 0px -50px 0px',
        threshold: 0.1
    };

    const observer = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('is-visible');
                // Unobserve so the animation only happens once
                observer.unobserve(entry.target);
            }
        });
    }, observerOptions);

    // Target headings, paragraphs, lists, and contact buttons inside main content
    const animateElements = document.querySelectorAll('main h1, main h2, main h3, main p, main ul, .contact-btn, .hero');
    
    animateElements.forEach(el => {
        // Prevent re-adding classes or conflicting with existing hero animations
        if (!el.classList.contains('hero')) {
            el.classList.add('scroll-fade-up');
        } else {
            // Keep existing hero animation, just observe it if needed or skip
        }
        observer.observe(el);
    });
});
</script>

</body>
</html>
